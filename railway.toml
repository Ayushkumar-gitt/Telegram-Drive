# railway.toml
# Railway reads this file to understand how to build and start your app.
# Docs: https://docs.railway.com/config-as-code/reference

[build]
# Build the React frontend first, then Railway runs the start command
buildCommand = "npm run build"

[deploy]
startCommand = "node server.mjs"
healthcheckPath = "/api/health"
healthcheckTimeout = 60   # seconds to wait for healthcheck after deploy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
