# railway.toml
# Railway reads this file to understand how to build and start your app.
# Docs: https://docs.railway.com/config-as-code/reference
#
# Architecture:
#   Frontend  → Cloudflare Pages (free, unlimited bandwidth, zero egress)
#   API only  → Railway (tiny JSON only, egress cost ~$0)
#   Files     → Browser ↔ Telegram directly via GramJS (zero Railway egress)

[build]
# No frontend build needed on Railway — frontend is on Cloudflare Pages.
# Just install dependencies.
buildCommand = "npm install"

[deploy]
startCommand = "node server.mjs"
healthcheckPath = "/api/health"
healthcheckTimeout = 60   # seconds to wait for healthcheck after deploy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
